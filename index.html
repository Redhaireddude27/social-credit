<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS Social Credit · 信息系统社会信用</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            height: 80px;
            background: #de2910;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 5px solid #ffde00;
        }

        header h1 {
            font-size: 28px;
        }

        header h1 span {
            color: #ffde00;
        }

        .star {
            color: #ffde00;
            font-size: 42px;
            margin-right: 15px;
        }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            height: calc(100vh - 80px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #b51d0b;
            color: white;
            overflow-y: auto;
            padding: 20px 15px;
            border-right: 4px solid #ffde00;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffde00;
        }

        .student {
            background: #d92712;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .student:hover {
            background: #ef3b20;
            border-color: #ffde00;
        }

        .student.active {
            background: #ffde00;
            color: #b51d0b;
            font-weight: bold;
        }

        .student-name {
            font-size: 15px;
        }

        .student-credit {
            font-size: 13px;
            margin-top: 4px;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h2 {
            color: #b51d0b;
        }

        .reset-btn {
            background: #b51d0b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #de2910;
        }

        /* CHART */
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            height: 65vh;
            min-height: 450px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* HISTORY */
        .history {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .history h2 {
            color: #b51d0b;
            margin-bottom: 15px;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .positive {
            color: green;
            font-weight: bold;
        }

        .negative {
            color: #c00;
            font-weight: bold;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 450px;
            max-width: 90%;
            padding: 25px;
            border-radius: 10px;
            border-top: 7px solid #de2910;
        }

        .modal-content h2 {
            color: #b51d0b;
            margin-bottom: 20px;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        .score-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .score-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn {
            background: #198754;
        }

        .subtract-btn {
            background: #b51d0b;
        }

        .cancel-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #777;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* MOBILE */
        @media (max-width: 800px) {
            body {
                overflow: auto;
            }

            .layout {
                height: auto;
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
            }

            .content {
                min-height: 700px;
            }

            .chart-container {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="star">★</div>
    <h1>
        IS Social Credit
        <span>· 信息系统社会信用</span>
    </h1>
</header>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Students · 学生</h2>
        <div id="studentList"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <div class="top-section">
            <div>
                <h2>Social Credit History · 社会信用历史</h2>
            </div>

            <button class="reset-btn" onclick="resetAll()">
                Reset All · 全部重置
            </button>
        </div>

        <div class="chart-container">
            <canvas id="creditChart"></canvas>
        </div>

        <div class="history">
            <h2>Recent Changes · 最近变化</h2>
            <div id="historyList"></div>
        </div>

    </main>
</div>


<!-- MODAL -->
<div class="modal" id="scoreModal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Update Social Credit · 更新社会信用
        </h2>

        <label>
            Points · 分数
        </label>

        <input
            type="number"
            id="pointsInput"
            value="20"
            min="1"
        >

        <label>
            Reason · 原因
        </label>

        <select id="reasonSelect">

            <option value="Made people laugh">
                Made people laugh · 让大家笑了
            </option>

            <option value="Made a great comment">
                Made a great comment · 发表精彩评论
            </option>

            <option value="Helped a classmate">
                Helped a classmate · 帮助同学
            </option>

            <option value="Answered a difficult question">
                Answered a difficult question · 回答了难题
            </option>

            <option value="Made a cringe comment">
                Made a cringe comment · 发表尴尬评论
            </option>

            <option value="Fell asleep in class">
                Fell asleep in class · 上课睡觉
            </option>

            <option value="Was on their phone">
                Was on their phone · 上课玩手机
            </option>

            <option value="Was late to class">
                Was late to class · 上课迟到
            </option>

            <option value="Custom reason">
                Custom reason · 自定义原因
            </option>

        </select>

        <input
            type="text"
            id="customReason"
            placeholder="Enter custom reason · 输入自定义原因"
            style="display:none; margin-top:10px;"
        >

        <div class="score-buttons">

            <button class="add-btn" onclick="changeCredit(1)">
                + 增加
            </button>

            <button class="subtract-btn" onclick="changeCredit(-1)">
                − 扣除
            </button>

        </div>

        <button class="cancel-btn" onclick="closeModal()">
            Cancel · 取消
        </button>

    </div>
</div>


<script>

    /* =========================================
       STUDENTS
       ========================================= */

    const students = [
        {
            id: 1,
            name: "Jackeline Michelle Arresis",
            chinese: "杰奎琳·米歇尔·阿雷西斯"
        },
        {
            id: 2,
            name: "Cameron Boyle",
            chinese: "卡梅隆·博伊尔"
        },
        {
            id: 3,
            name: "Tye Lawrence Buckley",
            chinese: "泰·劳伦斯·巴克利"
        },
        {
            id: 4,
            name: "Haley Marie Chadwick",
            chinese: "海莉·玛丽·查德威克"
        },
        {
            id: 5,
            name: "Youjin Cho",
            chinese: "赵宥真"
        },
        {
            id: 6,
            name: "Kyle Christensen",
            chinese: "凯尔·克里斯滕森"
        },
        {
            id: 7,
            name: "Nicholas Gregory Cioffi",
            chinese: "尼古拉斯·格雷戈里·乔菲"
        },
        {
            id: 8,
            name: "Aaron Wilde Conlin",
            chinese: "亚伦·王尔德·康林"
        },
        {
            id: 9,
            name: "Bradley Troy Cox",
            chinese: "布拉德利·特洛伊·考克斯"
        },
        {
            id: 10,
            name: "Chloe Celestia DePierro",
            chinese: "克洛伊·塞莱斯蒂娅·德皮耶罗"
        },
        {
            id: 11,
            name: "Aysha Entrikin",
            chinese: "艾莎·恩特里金"
        },
        {
            id: 12,
            name: "Jonathon Andrew Fernelius",
            chinese: "乔纳森·安德鲁·费内利乌斯"
        },
        {
            id: 13,
            name: "Nolan Ford",
            chinese: "诺兰·福特"
        },
        {
            id: 14,
            name: "Ivan Galan Vintimilla",
            chinese: "伊万·加兰·文蒂米利亚"
        },
        {
            id: 15,
            name: "Jake Gardanier",
            chinese: "杰克·加达尼尔"
        },
        {
            id: 16,
            name: "Andrew Gardner",
            chinese: "安德鲁·加德纳"
        },
        {
            id: 17,
            name: "Brinley Jeanne Gregory",
            chinese: "布林利·珍妮·格雷戈里"
        },
        {
            id: 18,
            name: "Matthew Kyriakos Grigoratos",
            chinese: "马修·基里亚科斯·格里戈拉托斯"
        },
        {
            id: 19,
            name: "Bryce Harman",
            chinese: "布莱斯·哈曼"
        },
        {
            id: 20,
            name: "Jacob Haslam",
            chinese: "雅各布·哈斯拉姆"
        },
        {
            id: 21,
            name: "Lot Holmstead",
            chinese: "洛特·霍姆斯特德"
        },
        {
            id: 22,
            name: "Jacob Irish",
            chinese: "雅各布·爱尔兰"
        },
        {
            id: 23,
            name: "Anna Johnson",
            chinese: "安娜·约翰逊"
        },
        {
            id: 24,
            name: "Taylor Kim",
            chinese: "泰勒·金"
        },
        {
            id: 25,
            name: "Justin Benjamin Larson",
            chinese: "贾斯汀·本杰明·拉尔森"
        },
        {
            id: 26,
            name: "William Alexander Mackey",
            chinese: "威廉·亚历山大·麦基"
        }
    ];


    /* =========================================
       DATA
       ========================================= */

    let scores = JSON.parse(
        localStorage.getItem("socialCreditScores")
    ) || {};

    let history = JSON.parse(
        localStorage.getItem("socialCreditHistory")
    ) || [];

    let selectedStudent = null;


    /* =========================================
       INITIALIZE SCORES
       ========================================= */

    students.forEach(student => {

        if (scores[student.id] === undefined) {
            scores[student.id] = 0;
        }

    });


    /* =========================================
       DISPLAY STUDENTS
       ========================================= */

    function renderStudents() {

        const list = document.getElementById("studentList");

        list.innerHTML = "";

        students.forEach(student => {

            const div = document.createElement("div");

            div.className = "student";

            div.innerHTML = `
                <div class="student-name">
                    ${student.name}
                </div>

                <div class="student-name">
                    ${student.chinese}
                </div>

                <div class="student-credit">
                    Social Credit · 社会信用:
                    <strong>${scores[student.id]}</strong>
                </div>
            `;

            div.onclick = () => openModal(student);

            list.appendChild(div);

        });

    }


    /* =========================================
       MODAL
       ========================================= */

    function openModal(student) {

        selectedStudent = student;

        document.getElementById("modalTitle").innerHTML =
            `${student.name} · ${student.chinese}`;

        document.getElementById("pointsInput").value = 20;

        document.getElementById("reasonSelect").value =
            "Made people laugh";

        document.getElementById("customReason").style.display =
            "none";

        document.getElementById("scoreModal").style.display =
            "flex";

    }


    function closeModal() {

        document.getElementById("scoreModal").style.display =
            "none";

        selectedStudent = null;

    }


    /* =========================================
       CUSTOM REASON
       ========================================= */

    document.getElementById("reasonSelect").addEventListener(
        "change",
        function() {

            const customInput =
                document.getElementById("customReason");

            if (this.value === "Custom reason") {

                customInput.style.display = "block";

            } else {

                customInput.style.display = "none";

            }

        }
    );


    /* =========================================
       CHANGE CREDIT
       ========================================= */

    function changeCredit(direction) {

        if (!selectedStudent) {
            return;
        }

        const points = parseInt(
            document.getElementById("pointsInput").value
        );

        if (isNaN(points) || points <= 0) {

            alert(
                "Please enter a valid number of points.\n" +
                "请输入有效的分数。"
            );

            return;

        }

        let reason =
            document.getElementById("reasonSelect").value;

        if (reason === "Custom reason") {

            reason =
                document.getElementById("customReason").value.trim();

            if (!reason) {

                alert(
                    "Please enter a reason.\n" +
                    "请输入原因。"
                );

                return;

            }

        }

        const amount = points * direction;

        scores[selectedStudent.id] += amount;


        /* Add history entry */

        history.push({

            studentId: selectedStudent.id,

            amount: amount,

            reason: reason,

            date: getDateKey(),

            timestamp: new Date().toLocaleString()

        });


        saveData();

        renderStudents();

        renderHistory();

        updateChart();

        closeModal();

    }


    /* =========================================
       DATE
       ========================================= */

    function getDateKey() {

        const date = new Date();

        const year = date.getFullYear();

        const month =
            String(date.getMonth() + 1).padStart(2, "0");

        const day =
            String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }


    /* =========================================
       SAVE DATA
       ========================================= */

    function saveData() {

        localStorage.setItem(
            "socialCreditScores",
            JSON.stringify(scores)
        );

        localStorage.setItem(
            "socialCreditHistory",
            JSON.stringify(history)
        );

    }


    /* =========================================
       HISTORY
       ========================================= */

    function renderHistory() {

        const list =
            document.getElementById("historyList");

        list.innerHTML = "";

        const recent =
            [...history].reverse().slice(0, 30);

        if (recent.length === 0) {

            list.innerHTML =
                "<p>No changes yet · 暂无变化</p>";

            return;

        }

        recent.forEach(item => {

            const student =
                students.find(
                    s => s.id === item.studentId
                );

            if (!student) return;

            const div =
                document.createElement("div");

            div.className = "history-item";

            const amountClass =
                item.amount >= 0
                    ? "positive"
                    : "negative";

            const sign =
                item.amount >= 0
                    ? "+"
                    : "";

            div.innerHTML = `

                <strong>
                    ${student.name}
                </strong>

                · ${student.chinese}

                <span class="${amountClass}">
                    ${sign}${item.amount}
                </span>

                <br>

                ${item.reason}

                <br>

                <small>
                    ${item.date}
                </small>

            `;

            list.appendChild(div);

        });

    }


    /* =========================================
       CHART
       ========================================= */

    let chart;


    function getDailyDates() {

        const dates = [
            ...new Set(
                history.map(item => item.date)
            )
        ];

        dates.sort();

        return dates;

    }


    function getDailyHistory(studentId) {

        const dates = getDailyDates();

        let runningTotal = 0;

        const values = [];

        dates.forEach(date => {

            const changes =
                history.filter(
                    item =>
                        item.studentId === studentId &&
                        item.date === date
                );

            changes.forEach(change => {

                runningTotal += change.amount;

            });

            values.push(runningTotal);

        });

        return values;

    }


    function updateChart() {

        const ctx =
            document
                .getElementById("creditChart")
                .getContext("2d");

        const dates = getDailyDates();

        const datasets =
            students.map(student => {

                return {

                    label:
                        `${student.name} · ${student.chinese}`,

                    data:
                        getDailyHistory(student.id),

                    tension: 0.3,

                    borderWidth: 2,

                    pointRadius: 3,

                    fill: false

                };

            });


        if (chart) {

            chart.destroy();

        }


        chart = new Chart(ctx, {

            type: "line",

            data: {

                labels: dates,

                datasets: datasets

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "nearest",

                    intersect: false

                },

                plugins: {

                    legend: {

                        position: "bottom",

                        labels: {

                            usePointStyle: true

                        }

                    },

                    title: {

                        display: true,

                        text:
                            "Social Credit · 社会信用积分",

                        font: {

                            size: 20

                        }

                    }

                },

                scales: {

                    x: {

                        title: {

                            display: true,

                            text:
                                "Date · 日期"

                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text:
                                "Social Credit · 社会信用积分"

                        },

                        beginAtZero: true

                    }

                }

            }

        });

    }


    /* =========================================
       RESET
       ========================================= */

    function resetAll() {

        const confirmed =
            confirm(
                "Reset all social credit scores and history?\n\n" +
                "重置所有社会信用分数和历史记录？"
            );

        if (!confirmed) {
            return;
        }


        scores = {};

        history = [];


        students.forEach(student => {

            scores[student.id] = 0;

        });


        saveData();

        renderStudents();

        renderHistory();

        updateChart();

    }


    /* =========================================
       START WEBSITE
       ========================================= */

    renderStudents();

    renderHistory();

    updateChart();

</script>

</body>
</html>
