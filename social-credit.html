<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IS Social Credit | 信息系统社会信用</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            height: 110px;
            background: #c8102e;
            color: white;
            display: flex;
            align-items: center;
            padding: 20px 35px;
            position: relative;
            overflow: hidden;
            border-bottom: 5px solid #f7d046;
        }

        header::before {
            content: "★";
            position: absolute;
            left: 25px;
            top: 10px;
            font-size: 80px;
            color: #f7d046;
            opacity: 0.95;
        }

        .header-content {
            margin-left: 110px;
        }

        header h1 {
            margin: 0;
            font-size: 2.3rem;
        }

        header h2 {
            margin: 4px 0 0;
            font-size: 1.3rem;
            font-weight: normal;
            color: #f7d046;
        }

        /* =========================================
           PAGE LAYOUT
        ========================================= */

        .page-layout {
            display: flex;
            min-height: calc(100vh - 110px);
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 300px;
            min-width: 300px;
            background: #8f0d20;
            color: white;
            padding: 20px 15px;
            overflow-y: auto;
            height: calc(100vh - 110px);
            position: sticky;
            top: 0;
        }

        .sidebar-title {
            text-align: center;
            border-bottom: 2px solid #f7d046;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .sidebar-title h2 {
            margin: 0;
            color: #f7d046;
            font-size: 1.4rem;
        }

        .sidebar-title p {
            margin: 5px 0 0;
            font-size: 0.9rem;
        }

        .student-card {
            background: #b5122b;
            border: 1px solid rgba(247, 208, 70, 0.4);
            border-radius: 7px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .student-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .student-name-chinese {
            font-size: 0.75rem;
            color: #f7d046;
            display: block;
            margin-top: 2px;
        }

        .student-score {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f7d046;
        }

        .sidebar-buttons {
            display: flex;
            gap: 5px;
        }

        .sidebar-buttons button {
            flex: 1;
            border: none;
            border-radius: 4px;
            padding: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .add-button {
            background: #188038;
        }

        .subtract-button {
            background: #5f0715;
        }

        .sidebar-buttons button:hover {
            opacity: 0.8;
        }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main-content {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        .welcome-section {
            margin-bottom: 25px;
        }

        .welcome-section h2 {
            margin: 0;
            color: #8f0d20;
            font-size: 1.8rem;
        }

        .welcome-section p {
            margin-top: 5px;
            color: #666;
        }

        /* =========================================
           GRAPH
        ========================================= */

        .graph-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            border-top: 5px solid #c8102e;
        }

        .graph-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .graph-title h2 {
            margin: 0;
            color: #8f0d20;
        }

        .graph-title p {
            margin: 3px 0 0;
            color: #777;
        }

        .graph-container {
            position: relative;
            height: 600px;
        }

        /* =========================================
           ACTIVITY HISTORY
        ========================================= */

        .history-section {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border-top: 5px solid #f7d046;
        }

        .history-section h2 {
            margin-top: 0;
            color: #8f0d20;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .history-student {
            font-weight: bold;
            width: 130px;
        }

        .history-reason {
            flex: 1;
            color: #555;
        }

        .history-date {
            font-size: 0.8rem;
            color: #888;
        }

        .history-change {
            font-size: 1.1rem;
            font-weight: bold;
            width: 60px;
            text-align: right;
        }

        .history-change.add {
            color: #188038;
        }

        .history-change.subtract {
            color: #c8102e;
        }

        .clear-button {
            margin-top: 15px;
            background: #8f0d20;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #c8102e;
        }

        /* =========================================
           MODAL
        ========================================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: #c8102e;
            color: white;
            padding: 20px;
            border-bottom: 4px solid #f7d046;
        }

        .modal-header h2 {
            margin: 0;
        }

        .modal-header p {
            margin: 4px 0 0;
            color: #f7d046;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-body select,
        .modal-body input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .submit-button {
            flex: 1;
            background: #188038;
            color: white;
        }

        .cancel-button {
            flex: 1;
            background: #ddd;
            color: #222;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            header {
                height: 90px;
                padding: 15px;
            }

            header::before {
                font-size: 55px;
            }

            .header-content {
                margin-left: 75px;
            }

            header h1 {
                font-size: 1.6rem;
            }

            header h2 {
                font-size: 1rem;
            }

            .page-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: auto;
                position: relative;
                max-height: 400px;
            }

            .main-content {
                padding: 15px;
            }

            .graph-container {
                height: 450px;
            }

            .history-item {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

    </style>
</head>


<body>

<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="header-content">

        <h1>IS Social Credit</h1>

        <h2>信息系统社会信用</h2>

    </div>

</header>


<div class="page-layout">


    <!-- =========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="sidebar-title">

            <h2>Classmates</h2>

            <p>同学名单</p>

        </div>

        <div id="studentGrid"></div>

    </aside>


    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <main class="main-content">


        <div class="welcome-section">

            <h2>Social Credit Dashboard</h2>

            <p>
                Social Credit Dashboard · 社会信用积分面板
            </p>

        </div>


        <!-- GRAPH -->

        <section class="graph-section">

            <div class="graph-title">

                <div>

                    <h2>Social Credit Over Time</h2>

                    <p>
                        社会信用积分变化趋势
                    </p>

                </div>

            </div>


            <div class="graph-container">

                <canvas id="creditChart"></canvas>

            </div>

        </section>


        <!-- HISTORY -->

        <section class="history-section">

            <h2>
                Recent Activity · 最近活动
            </h2>

            <div id="historyList">

                <p>
                    No activity yet · 暂无活动
                </p>

            </div>

            <button
                class="clear-button"
                onclick="clearAllData()"
            >
                Reset All Social Credit · 重置所有积分
            </button>

        </section>


    </main>

</div>


<!-- =========================================
     MODAL
========================================= -->

<div id="creditModal" class="modal">

    <div class="modal-content">


        <div class="modal-header">

            <h2 id="modalTitle">
                Change Social Credit
            </h2>

            <p>
                调整社会信用积分
            </p>

        </div>


        <div class="modal-body">


            <label for="changeType">
                Change · 积分变化
            </label>

            <select id="changeType">

                <option value="add">
                    Add Social Credit · 增加积分
                </option>

                <option value="subtract">
                    Subtract Social Credit · 扣除积分
                </option>

            </select>


            <label for="pointAmount">
                Points · 积分数量
            </label>

            <input
                type="number"
                id="pointAmount"
                min="1"
                value="20"
            >


            <label for="reason">
                Reason · 原因
            </label>

            <select id="reason">

                <option value="Made people laugh">
                    Made people laugh · 让大家笑了
                </option>

                <option value="Made a great comment">
                    Made a great comment · 发表精彩评论
                </option>

                <option value="Helped a classmate">
                    Helped a classmate · 帮助同学
                </option>

                <option value="Answered a difficult question">
                    Answered a difficult question · 回答了难题
                </option>

                <option value="Made a cringe comment">
                    Made a cringe comment · 发表尴尬评论
                </option>

                <option value="Fell asleep in class">
                    Fell asleep in class · 上课睡觉
                </option>

                <option value="Was on their phone">
                    Was on their phone · 上课玩手机
                </option>

                <option value="Was late to class">
                    Was late to class · 上课迟到
                </option>

                <option value="Custom">
                    Custom reason · 自定义原因
                </option>

            </select>


            <input
                type="text"
                id="customReason"
                placeholder="Custom reason · 自定义原因"
                style="display:none; margin-top:10px;"
            >


            <div class="modal-buttons">

                <button
                    class="cancel-button"
                    onclick="closeModal()"
                >
                    Cancel · 取消
                </button>

                <button
                    class="submit-button"
                    onclick="submitCreditChange()"
                >
                    Apply Change · 确认
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================
       STUDENTS
    ========================================= */

    const students = [

        "Student 01",
        "Student 02",
        "Student 03",
        "Student 04",
        "Student 05",
        "Student 06",
        "Student 07",
        "Student 08",
        "Student 09",
        "Student 10",
        "Student 11",
        "Student 12",
        "Student 13",
        "Student 14",
        "Student 15",
        "Student 16",
        "Student 17",
        "Student 18",
        "Student 19",
        "Student 20",
        "Student 21",
        "Student 22",
        "Student 23",
        "Student 24",
        "Student 25",
        "Student 26"

    ];


    /*
       Placeholder Chinese names.

       Replace these later if you want.
    */

    const chineseNames = [

        "学生 01",
        "学生 02",
        "学生 03",
        "学生 04",
        "学生 05",
        "学生 06",
        "学生 07",
        "学生 08",
        "学生 09",
        "学生 10",
        "学生 11",
        "学生 12",
        "学生 13",
        "学生 14",
        "学生 15",
        "学生 16",
        "学生 17",
        "学生 18",
        "学生 19",
        "学生 20",
        "学生 21",
        "学生 22",
        "学生 23",
        "学生 24",
        "学生 25",
        "学生 26"

    ];


    /* =========================================
       DATA
    ========================================= */

    let data =
        JSON.parse(
            localStorage.getItem("socialCreditData")
        );


    if (!data) {

        data = {

            scores: {},

            history: []

        };


        students.forEach(student => {

            data.scores[student] = 0;

        });


        saveData();

    }


    function saveData() {

        localStorage.setItem(
            "socialCreditData",
            JSON.stringify(data)
        );

    }


    /* =========================================
       SIDEBAR
    ========================================= */

    function renderStudents() {

        const grid =
            document.getElementById("studentGrid");

        grid.innerHTML = "";


        students.forEach((student, index) => {

            const score =
                data.scores[student];


            const card =
                document.createElement("div");

            card.className =
                "student-card";


            card.innerHTML = `

                <div class="student-info">

                    <div>

                        <div class="student-name">
                            ${student}
                        </div>

                        <span class="student-name-chinese">
                            ${chineseNames[index]}
                        </span>

                    </div>

                    <div class="student-score">
                        ${score}
                    </div>

                </div>


                <div class="sidebar-buttons">

                    <button
                        class="add-button"
                        onclick="openModal('${student}', 'add')"
                    >
                        + 增加
                    </button>

                    <button
                        class="subtract-button"
                        onclick="openModal('${student}', 'subtract')"
                    >
                        − 扣除
                    </button>

                </div>

            `;


            grid.appendChild(card);

        });

    }


    /* =========================================
       MODAL
    ========================================= */

    let selectedStudent = null;


    function openModal(student, type) {

        selectedStudent = student;


        document.getElementById("changeType").value =
            type;


        document.getElementById("modalTitle").textContent =
            student + " · Change Social Credit";


        document.getElementById("pointAmount").value =
            20;


        document.getElementById("reason").value =
            "Made people laugh";


        document.getElementById("customReason").style.display =
            "none";


        document.getElementById("creditModal").style.display =
            "flex";

    }


    function closeModal() {

        document.getElementById("creditModal").style.display =
            "none";

        selectedStudent = null;

    }


    /* =========================================
       CUSTOM REASON
    ========================================= */

    document.getElementById("reason").addEventListener(
        "change",
        function() {

            const custom =
                document.getElementById("customReason");


            if (this.value === "Custom") {

                custom.style.display =
                    "block";

            } else {

                custom.style.display =
                    "none";

            }

        }
    );


    /* =========================================
       CHANGE SOCIAL CREDIT
    ========================================= */

    function submitCreditChange() {

        if (!selectedStudent) {
            return;
        }


        const type =
            document.getElementById("changeType").value;


        const points =
            parseInt(
                document.getElementById("pointAmount").value
            );


        if (!points || points <= 0) {

            alert(
                "Please enter a positive number of points."
            );

            return;

        }


        let reason =
            document.getElementById("reason").value;


        if (reason === "Custom") {

            reason =
                document.getElementById("customReason")
                    .value
                    .trim();


            if (!reason) {

                alert(
                    "Please enter a reason."
                );

                return;

            }

        }


        let change = points;


        if (type === "subtract") {

            change = -points;

        }


        /* Update score */

        data.scores[selectedStudent] += change;


        /* Record transaction */

        data.history.push({

            student: selectedStudent,

            change: change,

            reason: reason,

            date: getDateKey(),

            time: new Date().toLocaleString()

        });


        saveData();


        renderStudents();

        renderHistory();

        updateChart();

        closeModal();

    }


    /* =========================================
       DAILY DATE
    ========================================= */

    function getDateKey() {

        const date = new Date();

        return date.getFullYear() +
            "-" +
            String(date.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(date.getDate()).padStart(2, "0");

    }


    /* =========================================
       HISTORY
    ========================================= */

    function renderHistory() {

        const historyList =
            document.getElementById("historyList");


        if (data.history.length === 0) {

            historyList.innerHTML =
                "<p>No activity yet · 暂无活动</p>";

            return;

        }


        historyList.innerHTML = "";


        const history =
            [...data.history].reverse();


        history.forEach(item => {

            const div =
                document.createElement("div");


            div.className =
                "history-item";


            const changeClass =
                item.change >= 0
                    ? "add"
                    : "subtract";


            const sign =
                item.change >= 0
                    ? "+"
                    : "";


            div.innerHTML = `

                <div class="history-student">
                    ${item.student}
                </div>

                <div class="history-reason">

                    ${item.reason}

                    <div class="history-date">
                        ${item.time}
                    </div>

                </div>

                <div class="history-change ${changeClass}">
                    ${sign}${item.change}
                </div>

            `;


            historyList.appendChild(div);

        });

    }


    /* =========================================
       DAILY GRAPH
    ========================================= */

    let creditChart;


    function getDailyDates() {

        const dates = [];


        data.history.forEach(item => {

            if (!dates.includes(item.date)) {

                dates.push(item.date);

            }

        });


        return dates;

    }


    function getDailyHistory(student) {

        const dates =
            getDailyDates();


        let score = 0;

        const values = [];


        dates.forEach(date => {

            data.history.forEach(item => {

                if (
                    item.student === student &&
                    item.date === date
                ) {

                    score += item.change;

                }

            });


            values.push(score);

        });


        return values;

    }


    function createChart() {

        const ctx =
            document
                .getElementById("creditChart")
                .getContext("2d");


        const datasets =
            students.map(student => {

                return {

                    label: student,

                    data:
                        getDailyHistory(student),

                    borderWidth: 2,

                    tension: 0.25,

                    pointRadius: 3,

                    fill: false

                };

            });


        creditChart =
            new Chart(ctx, {

                type: "line",

                data: {

                    labels:
                        getDailyDates(),

                    datasets:
                        datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        mode: "index",

                        intersect: false

                    },

                    plugins: {

                        legend: {

                            position: "bottom"

                        },

                        tooltip: {

                            mode: "index",

                            intersect: false

                        }

                    },

                    scales: {

                        y: {

                            title: {

                                display: true,

                                text:
                                    "Social Credit · 社会信用积分"

                            }

                        },

                        x: {

                            title: {

                                display: true,

                                text:
                                    "Date · 日期"

                            }

                        }

                    }

                }

            });

    }


    function updateChart() {

        if (!creditChart) {
            return;
        }


        creditChart.data.labels =
            getDailyDates();


        creditChart.data.datasets =
            students.map(student => ({

                label: student,

                data:
                    getDailyHistory(student),

                borderWidth: 2,

                tension: 0.25,

                pointRadius: 3,

                fill: false

            }));


        creditChart.update();

    }


    /* =========================================
       RESET
    ========================================= */

    function clearAllData() {

        const confirmation =
            confirm(
                "Are you sure you want to reset everyone's social credit?\n\n确定要重置所有人的社会信用积分吗？"
            );


        if (!confirmation) {
            return;
        }


        data = {

            scores: {},

            history: []

        };


        students.forEach(student => {

            data.scores[student] = 0;

        });


        saveData();

        renderStudents();

        renderHistory();

        updateChart();

    }


    /* =========================================
       CLOSE MODAL OUTSIDE CLICK
    ========================================= */

    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById("creditModal");


            if (event.target === modal) {

                closeModal();

            }

        }
    );


    /* =========================================
       START WEBSITE
    ========================================= */

    renderStudents();

    renderHistory();

    createChart();

</script>

</body>
</html>
